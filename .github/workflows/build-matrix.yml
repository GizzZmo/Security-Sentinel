name: 🏗️ Advanced Build Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  NODE_VERSION: '20.19.0'
  GO_VERSION: '1.24.x'

jobs:
  cpp-matrix-build:
    name: C++ Build - ${{ matrix.os }} (${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        config: [Debug, Release]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: 🛠️ Setup CMake
      uses: lukka/get-cmake@628dd514bed37cb0a609e84a6186cbbaa2fc0140

    - name: 🛠️ Setup MSVC compiler environment (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: 🧰 Ensure Ninja is available (Windows)
      if: runner.os == 'Windows'
      run: |
        if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
          choco install ninja --yes --no-progress
        }

    - name: 🏗️ Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -S . -B build-${{ matrix.config }} -G "Ninja Multi-Config"

    - name: 🏗️ Configure CMake (Non-Windows)
      if: runner.os != 'Windows'
      run: cmake -S . -B build-${{ matrix.config }} -DCMAKE_BUILD_TYPE=${{ matrix.config }}

    - name: 🔨 Build
      run: cmake --build build-${{ matrix.config }} --config ${{ matrix.config }} --parallel 4
      continue-on-error: ${{ runner.os != 'Windows' }}

    - name: 📊 Build Statistics (Windows)
      if: runner.os == 'Windows'
      run: |
        echo "### Build Statistics - ${{ matrix.os }} (${{ matrix.config }})" >> $env:GITHUB_STEP_SUMMARY
        echo "- **OS**: ${{ matrix.os }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- **Configuration**: ${{ matrix.config }}" >> $env:GITHUB_STEP_SUMMARY

        $candidatePaths = @(
          "build-${{ matrix.config }}/bin/${{ matrix.config }}",
          "build-${{ matrix.config }}/bin"
        )

        foreach ($path in $candidatePaths) {
          if (Test-Path $path) {
            $sizeBytes = (Get-ChildItem -Path $path -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if ($null -eq $sizeBytes) { $sizeBytes = 0 }
            $sizeMB = [math]::Round($sizeBytes / 1MB, 2)
            echo "- **Binary Size**: ${sizeMB} MB" >> $env:GITHUB_STEP_SUMMARY
            break
          }
        }
      shell: pwsh
      continue-on-error: true

    - name: 📊 Build Statistics (Non-Windows)
      if: runner.os != 'Windows'
      run: |
        echo "### Build Statistics - ${{ matrix.os }} (${{ matrix.config }})" >> $GITHUB_STEP_SUMMARY
        echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Configuration**: ${{ matrix.config }}" >> $GITHUB_STEP_SUMMARY
        if [ -d "build-${{ matrix.config }}/bin" ]; then
          echo "- **Binary Size**: $(du -sh build-${{ matrix.config }}/bin 2>/dev/null | cut -f1 || echo 'N/A')" >> $GITHUB_STEP_SUMMARY
        fi
      shell: bash
      continue-on-error: true

    - name: 📤 Upload Windows build artifacts
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
      with:
        name: cpp-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build-${{ matrix.config }}/bin/${{ matrix.config }}/**/*
          build-${{ matrix.config }}/bin/**/*
          build-${{ matrix.config }}/${{ matrix.config }}/**/*
        retention-days: 14
        if-no-files-found: warn

    - name: 📤 Upload non-Windows release artifacts
      if: runner.os != 'Windows' && matrix.config == 'Release'
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
      with:
        name: cpp-${{ matrix.os }}-${{ matrix.config }}
        path: |
          build-${{ matrix.config }}/bin/**/*
          build-${{ matrix.config }}/${{ matrix.config }}/**/*
        retention-days: 14
        if-no-files-found: warn

  go-build:
    name: Go Module Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: 🐹 Setup Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: core-go/go.sum

    - name: 📦 Download dependencies
      working-directory: core-go
      run: go mod download

    - name: 🔨 Build Go modules
      working-directory: core-go
      run: |
        go build -v ./...
        go build -buildmode=c-archive -o libcore.a

    - name: 🧪 Run Go tests
      working-directory: core-go
      run: go test -v ./... -coverprofile=coverage.out
      continue-on-error: true

    - name: 📊 Go Build Statistics
      working-directory: core-go
      run: |
        echo "### Go Build Statistics - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **OS**: ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Go Version**: $(go version)" >> $GITHUB_STEP_SUMMARY
        if [ -f "libcore.a" ]; then
          SIZE=$(du -h libcore.a | cut -f1)
          echo "- **Library Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
        fi
        if [ -f "coverage.out" ]; then
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}')
          echo "- **Test Coverage**: $COVERAGE" >> $GITHUB_STEP_SUMMARY
        fi
      shell: bash
      continue-on-error: true

    - name: 📤 Upload Go artifacts
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
      with:
        name: go-${{ matrix.os }}
        path: |
          core-go/libcore.a
          core-go/libcore.so
          core-go/coverage.out
        retention-days: 14
        if-no-files-found: warn

  web-build:
    name: Web Build - Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.x']

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

    - name: 🟢 Setup Node.js
      uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'

    - name: 📦 Install dependencies
      run: npm ci

    - name: 🔍 Type check
      run: npx tsc --noEmit

    - name: 🏗️ Build web interface
      run: npm run build

    - name: 📊 Build Statistics
      run: |
        echo "### Web Build Statistics - Node ${{ matrix.node }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Node Version**: $(node --version)" >> $GITHUB_STEP_SUMMARY
        echo "- **NPM Version**: $(npm --version)" >> $GITHUB_STEP_SUMMARY
        if [ -d "dist" ]; then
          SIZE=$(du -sh dist | cut -f1)
          FILES=$(find dist -type f | wc -l)
          echo "- **Build Size**: $SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **File Count**: $FILES" >> $GITHUB_STEP_SUMMARY
        fi

    - name: 📤 Upload web artifacts
      if: matrix.node == '20.19.0'
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
      with:
        name: web-build
        path: dist/
        retention-days: 14

  build-summary:
    name: 📊 Build Summary Report
    runs-on: ubuntu-latest
    needs: [cpp-matrix-build, go-build, web-build]
    if: always()

    steps:
    - name: 📥 Download all artifacts
      uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
      with:
        path: artifacts/

    - name: 📊 Generate build report
      run: |
        echo "# 🏗️ Build Matrix Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## Artifact Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ -d "artifacts" ]; then
          echo "| Artifact | Size | Files |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|-------|" >> $GITHUB_STEP_SUMMARY

          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              name=$(basename "$dir")
              size=$(du -sh "$dir" 2>/dev/null | cut -f1 || echo "N/A")
              files=$(find "$dir" -type f 2>/dev/null | wc -l || echo "0")
              echo "| $name | $size | $files |" >> $GITHUB_STEP_SUMMARY
            fi
          done
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build matrix completed successfully" >> $GITHUB_STEP_SUMMARY
